<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">💎</div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Log in to your Expense Tracker account</p>
      </div>

      <div class="auth-body">
        <div id="loginAlert" class="alert-banner alert-danger"></div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input
              type="email"
              id="loginEmail"
              class="form-input"
              placeholder="name@example.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-input-wrap">
              <input
                type="password"
                id="loginPassword"
                class="form-input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" title="Toggle password visibility">👁️‍🗨️</button>
            </div>
          </div>

          <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
            Sign In
          </button>
        </form>

        <p class="auth-footer-text">
          Don't have an account? <a href="register.html">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already authenticated
      auth.redirectIfAuthenticated();

      const urlParams = new URLSearchParams(window.location.search);
      const alertBox = document.getElementById('loginAlert');

      if (urlParams.get('registered') === 'true') {
        alertBox.className = 'alert-banner alert-success active';
        alertBox.textContent = 'Account created successfully! Please log in.';
      } else if (urlParams.get('expired') === 'true') {
        alertBox.className = 'alert-banner alert-danger active';
        alertBox.textContent = 'Session expired. Please log in again to continue.';
      } else if (urlParams.get('logout') === 'true') {
        alertBox.className = 'alert-banner alert-success active';
        alertBox.textContent = 'You have logged out successfully.';
      }

      const form = document.getElementById('loginForm');
      const btn = document.getElementById('btnLogin');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.remove('active');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
          const res = await api.post('/auth/login', { email, password });
          auth.setSession(res.data.token, res.data.user);
          window.location.href = 'dashboard.html';
        } catch (err) {
          alertBox.className = 'alert-banner alert-danger active';
          alertBox.textContent = err.message || 'Invalid email or password.';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
